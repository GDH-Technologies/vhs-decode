[build-system]
# setuptools_scm is pinned to 10.x: the GDH version scheme uses the nested
# [tool.setuptools_scm.tag] / [.scm.git] tables and the "only-version" scheme,
# none of which exist in 8.x. A looser floor silently degrades the version.
requires = ["setuptools>=61", "setuptools-rust", "setuptools_scm>=10,<11", "wheel", "Cython", "numpy"]
# requires = ["setuptools>=61", "wheel", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "vhs_decode"
description = "Software Decoder for raw rf captures of laserdisc, vhs and other analog video formats"
readme = "README_pypi.md"
requires-python = ">=3.11"
keywords = ["laserdisc", "vhs", "video", "tape", "decoder"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
]

dependencies = [
    "cython",
    "matplotlib",
    "noisereduce>=2.0.0",
    "numba>=0.59",
    "numpy>=1.24",
    "scipy>=1.11",
    "setproctitle",
    "sounddevice",
    "soundfile>=0.13.1",
    "soxr",
    "static-ffmpeg",
    "av",
]
dynamic = ["version"]
# version = "0.2.1dev0"

[project.optional-dependencies]
intel = [ "intel-cmplr-lib-rt", "icc_rt" ]
hifi_gui_qt5 = [ "PyQt5>=5.14.1" ]
hifi_gui_qt6 = [ "PyQt6>=6.4.2" ]
cuda13 = [ "cupy-cuda13x", "nvidia-cuda-nvrtc", "nvidia-cufft" ]
cuda12 = [ "cupy-cuda12x", "nvidia-cuda-nvrtc-cu12", "nvidia-cufft-cu12" ]
cuda11 = [ "cupy-cuda11x", "nvidia-cuda-nvrtc-cu11", "nvidia-cufft-cu11" ]
# Can probably be depcretaded now since it's also an option in vhs-decode to use it.
hifi_gnuradio = [ "pyzmq" ]
gnuradio = [ "pyzmq" ]
test = [ "pytest>=7.0" ]

[project.scripts]
ld-decode = "lddecode.main:main"
ld-ldf-reader = "lddecode.ldf_reader:main"
ld-ldf-reader-py = "lddecode.ldf_reader:main"
ld-lds-reader = "lddecode.lds_reader:main"
vhs-decode = "vhsdecode.main:main"
cvbs-decode = "cvbsdecode.main:main"
hifi-decode = "vhsdecode.hifi.main:main"
filter-tune = "filter_tune.filter_tune:main"
decode-launcher = "vhsdecode.decode_launcher:main"

#[console_scripts]
# TODO: These should maybe be made modules too
#ld-cut = "ld-cut"
#cx-expander = "cx-expander"
#tbc-video-export = "tbc-video-export"

[project.urls]
Homepage = "https://www.domesday86.com"
Repository = "https://github.com/oyvindln/vhs-decode"
Documentation = "https://github.com/oyvindln/vhs-decode/wiki"
Issues = "https://github.com/oyvindln/vhs-decode/issues"

[tool.setuptools_scm]
write_to = "vhsdecode/_version.py"
# Silences the pending-default DeprecationWarning; the default flips next major.
write_to_source = true
# The public version is upstream's release, verbatim and never bumped. The GDH
# delta lives entirely in the local segment, supplied by gdh_local_scheme in
# setup.py (a callable cannot be expressed in TOML). See scripts/gdh_version.py.
version_scheme = "only-version"
# No git (nix, or an unpacked tarball): a preformatted fallback, which makes
# setuptools_scm skip both schemes rather than calling them without a repo.
fallback_version = "0.0.0"

[tool.setuptools_scm.tag]
# One capture group, named `version`, as setuptools_scm requires. The trailing
# lookahead lets a gdh tag match without swallowing its suffix into group(0) --
# consuming it instead would trip the "tag will be stripped of its suffix"
# warning on every build.
regex = '^(?:v)?(?P<version>\d+(?:\.\d+)*(?:(?:a|b|rc)\d*)?)(?=$|-gdh-\d+\.\d+$)'

[tool.setuptools_scm.scm.git]
# Upstream release tags only. Two exclusions matter:
#   nightly-*  nightly.yml is live on this fork and cuts dated tags
#   *-gdh-*    a gdh tag must never become the public version
# Restricted to real version tags for the original reason too: tags like
# "rev4.0" would otherwise break parsing.
describe_command = [
    "git", "describe", "--dirty", "--tags", "--long", "--abbrev=8",
    "--match", "v[0-9]*", "--match", "[0-9]*",
    "--exclude", "nightly-*", "--exclude", "*-gdh-*",
]

[tool.setuptools.package-data]
vhs_decode = ["*.txt"]
lddecode = ["py.typed", "version", "sinc_lut.npz"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint]
max-line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.setuptools-rust.ext-modules]]
# Private Rust extension module to be nested into the Python package
target = "vhsd_rust"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "integration: end-to-end decode tests requiring real RF data",
]

# Needed to prevent building for older macos versions not supported by rust - see https://cibuildwheel.pypa.io/en/stable/faq/#building-rust-wheels
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.12"
